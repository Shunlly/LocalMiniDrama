misconfigurations:
  - id: AVD-DS-0002
    paths:
      - Dockerfile
      - backend-node/Dockerfile
    statement: Trivy evaluates Dockerfile Config.User before the reviewed entrypoint transition. The pinned Node runtime maps node to UID 1000; after a same-filesystem one-time ownership migration, the entrypoint replaces PID 1 with the requested command under that account. Release evidence validation rejects any change to this source contract.
    expired_at: 2027-07-17
