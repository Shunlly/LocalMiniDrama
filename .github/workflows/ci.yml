name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-contract:
    name: Release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend-node/package-lock.json
      - name: Install runtime policy dependencies
        working-directory: backend-node
        run: npm ci --ignore-scripts
      - name: Verify package and API versions
        run: |
          npm run check
          npm run verify:version
      - name: Validate Docker Compose
        run: docker compose --profile e2e --profile verify config --quiet

  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend-node/package-lock.json
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install dependencies
        working-directory: backend-node
        run: npm ci
      - name: Verify
        working-directory: backend-node
        run: npm run verify

  frontend:
    name: Frontend verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontweb/package-lock.json
      - name: Install dependencies
        working-directory: frontweb
        run: npm ci
      - name: Verify
        working-directory: frontweb
        run: npm run verify

  desktop:
    name: Windows release candidate
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontweb/package-lock.json
            desktop/package-lock.json
      - name: Install pinned media tools
        shell: pwsh
        run: |
          $mediaToolsVersion = (Get-Content desktop/package.json | ConvertFrom-Json).mediaToolsVersion
          if ($mediaToolsVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid desktop mediaToolsVersion' }
          choco install ffmpeg --version=$mediaToolsVersion -y --no-progress --allow-downgrade
          if (-not $env:ChocolateyInstall) { throw 'ChocolateyInstall is unavailable after FFmpeg installation' }
          $binaryRoot = Join-Path $env:ChocolateyInstall 'lib\ffmpeg\tools\ffmpeg\bin'
          $ffmpegPath = Join-Path $binaryRoot 'ffmpeg.exe'
          $ffprobePath = Join-Path $binaryRoot 'ffprobe.exe'
          if (-not (Test-Path -LiteralPath $ffmpegPath) -or -not (Test-Path -LiteralPath $ffprobePath)) {
            throw "Chocolatey FFmpeg package binaries are missing from $binaryRoot"
          }
          node desktop/scripts/media-tool-policy.js verify-tools $ffmpegPath $ffprobePath win32 x64
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey FFmpeg executable trust verification failed' }
          & $ffmpegPath -version
          & $ffprobePath -version
          "FFMPEG_PATH=$ffmpegPath" >> $env:GITHUB_ENV
          "FFPROBE_PATH=$ffprobePath" >> $env:GITHUB_ENV
      - name: Install frontend dependencies
        working-directory: frontweb
        run: npm ci
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Verify Electron runtime and packaging contract
        working-directory: desktop
        run: npm run verify
      - name: Build, smoke and verify Windows release candidate
        run: npm run verify:release:windows
      - name: Upload Windows release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-unverified-ci-${{ github.sha }}
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
            desktop/release/*.zip
            desktop/release/*.cdx.json
            desktop/release/media-tools.json
          if-no-files-found: error
          retention-days: 14

  windows-release-security:
    name: Verify Windows release security before tagging
    needs: desktop
    permissions:
      contents: read
    uses: ./.github/workflows/windows-release-security.yml
    with:
      artifact-key: ci-${{ github.sha }}

  dependency-audit:
    name: Dependency audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend-node, frontweb, desktop]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Block high and critical advisories
        working-directory: ${{ matrix.package }}
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan complete repository history for secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker run --rm "$GITLEAKS_IMAGE" version)" = 'v8.30.1'
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            "$GITLEAKS_IMAGE" \
            git --config .gitleaks.toml --redact --no-banner --log-opts=--all

  source-security:
    name: Source dependency and configuration security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:a8ca29078522f30393bdb34225e4c0994d38f37083be81a42da3a2a7e1488e9e
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Scan source dependencies and configuration with pinned Trivy
        shell: bash
        run: |
          set -euo pipefail
          readonly expected_version='0.64.1'
          readonly evidence_dir="$GITHUB_WORKSPACE/artifacts/source-security"
          readonly cache_dir="$RUNNER_TEMP/trivy-cache"
          mkdir -p "$evidence_dir" "$cache_dir"

          run_trivy() {
            docker run --rm \
              --volume "$GITHUB_WORKSPACE:/workspace:ro" \
              --volume "$evidence_dir:/evidence" \
              --volume "$cache_dir:/root/.cache/trivy" \
              --workdir /workspace \
              "$TRIVY_IMAGE" "$@"
          }

          version="$(run_trivy --version | awk -F': ' '/^Version:/{print $2; exit}')"
          test "$version" = "$expected_version"
          printf '%s\n' "$version" > "$evidence_dir/trivy-version.txt"
          run_trivy fs --skip-version-check --scanners vuln,misconfig --exit-code 1 \
            --severity HIGH,CRITICAL --ignore-unfixed --include-dev-deps \
            --ignorefile backend-node/.trivyignore.yaml \
            --format json --output /evidence/trivy-source.json .
      - name: Upload source security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-security-${{ github.sha }}
          path: artifacts/source-security/
          if-no-files-found: error
          retention-days: 14

  rollback-drill:
    name: Isolated backup and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend-node/package-lock.json
      - name: Install backend dependencies
        run: npm --prefix backend-node ci
      - name: Initialize isolated rollback source
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix backend-node run migrate
          mkdir -p backend-node/data/storage backend-node/data/story_sources
          test -z "$(git status --porcelain)"
      - name: Run and validate rollback drill
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:rollback 2>&1 | tee "$RUNNER_TEMP/rollback-drill.log"
          node - <<'NODE'
          const assert = require('node:assert/strict')
          const fs = require('node:fs')
          const summary = JSON.parse(fs.readFileSync('artifacts/rollback-drill/summary.json', 'utf8'))
          assert.equal(summary.status, 'passed')
          assert.equal(summary.source.commit, process.env.GITHUB_SHA)
          assert.equal(summary.source.version, '1.3.3')
          assert.equal(summary.source.working_tree_dirty, false)
          NODE
      - name: Upload rollback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rollback-drill-${{ github.sha }}
          path: |
            artifacts/rollback-drill/
            ${{ runner.temp }}/rollback-drill.log
          if-no-files-found: warn
          retention-days: 14

  docker-production-e2e:
    name: Docker production E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LOCALMINIDRAMA_BUILD_REVISION: ${{ github.sha }}
      LOCALMINIDRAMA_IMAGE_TAG: ${{ github.sha }}
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:a8ca29078522f30393bdb34225e4c0994d38f37083be81a42da3a2a7e1488e9e
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontweb/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontweb
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify Docker build context boundaries
        run: npm run verify:docker:artifact
      - name: Verify clean Docker build revision
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$LOCALMINIDRAMA_BUILD_REVISION"
      - name: Start production containers and local E2E provider
        run: docker compose --profile e2e up -d --build --wait
      - name: Record and scan final production images with Trivy
        shell: bash
        run: |
          set -euo pipefail
          readonly evidence_dir="$GITHUB_WORKSPACE/artifacts/e2e-production"
          readonly cache_dir="$RUNNER_TEMP/trivy-cache"
          readonly backend_image="localminidrama-backend:$LOCALMINIDRAMA_IMAGE_TAG"
          readonly frontend_image="localminidrama-frontend:$LOCALMINIDRAMA_IMAGE_TAG"
          mkdir -p "$evidence_dir" "$cache_dir"

          : > "$evidence_dir/docker-image-ids.txt"
          for image in "$backend_image" "$frontend_image"; do
            image_id="$(docker image inspect --format '{{.Id}}' "$image")"
            revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")"
            test "$revision" = "$LOCALMINIDRAMA_BUILD_REVISION"
            printf '%s\t%s\t%s\n' "$image" "$image_id" "$revision" >> "$evidence_dir/docker-image-ids.txt"
          done
          docker image inspect "$backend_image" "$frontend_image" > "$evidence_dir/docker-images.json"

          run_trivy() {
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "$GITHUB_WORKSPACE:/workspace:ro" \
              --volume "$evidence_dir:/evidence" \
              --volume "$cache_dir:/root/.cache/trivy" \
              "$TRIVY_IMAGE" "$@"
          }

          version="$(run_trivy --version | awk -F': ' '/^Version:/{print $2; exit}')"
          test "$version" = '0.64.1'
          printf '%s\n' "$version" > "$evidence_dir/trivy-version.txt"

          status=0
          run_trivy image --skip-version-check --scanners vuln --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            --format json --output /evidence/trivy-backend.json "$backend_image" || status=$?
          run_trivy image --skip-version-check --scanners vuln --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            --format json --output /evidence/trivy-frontend.json "$frontend_image" || status=$?
          exit "$status"
      - name: Verify code inside containers
        run: npm run verify:docker:containers
      - name: Run full production workflow, QA, timeline, export and browser checks
        if: always()
        run: npm run verify:e2e
      - name: Capture container logs on failure
        if: failure()
        run: |
          mkdir -p artifacts/e2e-production
          docker compose --profile e2e logs --no-color 2>&1 | node frontweb/scripts/e2e-production.cjs --sanitize-log > artifacts/e2e-production/docker-e2e.log
      - name: Upload production E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-e2e-${{ github.sha }}
          path: artifacts/e2e-production/
          if-no-files-found: error
          retention-days: 14
      - name: Stop containers
        if: always()
        run: docker compose --profile e2e down --volumes --remove-orphans
